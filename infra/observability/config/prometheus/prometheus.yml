  - job_name: 'services'
    static_configs:
      - targets:
          - 'localhost:9090'
          - 'node_exporter:9100'
          - 'pushgateway:9091'
          - 'sidekiq:7433'
          - 'rabbitmq_exporter:9419'
          - 'postgres_exporter:9187'
          - 'redis_exporter:9121'
          - 'rabbitmq:15692'
    metrics_path: '/metrics'
    scrape_interval: 30s
    
  - job_name: 'custom-metrics'
    static_configs:
      - targets: ['localhost:9105']