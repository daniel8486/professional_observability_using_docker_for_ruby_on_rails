groups:
  - name: rails-app.rules
    rules:
      - alert: HighErrorRate
        expr: rate(application_errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors per second"

      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(api_request_duration_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response time detected"
          description: "95th percentile response time is {{ $value }} seconds"

      - alert: RailsAppDown
        expr: up{job="services-app-https"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Rails application is down"
          description: "Rails application has been down for more than 1 minute"

      - alert: RailsAppDownHTTP
        expr: up{job="services-app-http"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Rails HTTP application is down"
          description: "Rails HTTP application has been down for more than 1 minute"

      - alert: ApiServicesAppSockDown
        expr: systemd_unit_state{name="name_service_app.sock",state="active"} != 1 #utilizo o systemd_unit_state
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "name_service_app.sock está fora do ar"
          description: "O serviço name_service_app.sock não está ativo há mais de 1 minuto"
